version: 2

# One combined PR for every ecosystem and directory; major version bumps are ignored.
multi-ecosystem-groups:
  all:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: bun
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: bun
    directory: /studio
    patterns: ["*"]
    multi-ecosystem-group: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: /iac/app
    patterns: ["*"]
    multi-ecosystem-group: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: terraform
    directory: /iac/bootstrap
    patterns: ["*"]
    multi-ecosystem-group: all
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
