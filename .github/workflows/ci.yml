name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  web:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catraders
          POSTGRES_PASSWORD: catraders
          POSTGRES_DB: catraders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catraders -d catraders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://catraders:catraders@localhost:5432/catraders
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate
      - run: bun run test
      - run: bun run build

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run build

      - name: Check generated Sanity types are up to date
        run: |
          bun run typegen
          git diff --exit-code ../src/sanity/types.ts

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.16"

      - run: terraform fmt -check -recursive iac

      - name: Validate stacks
        run: |
          for stack in iac/bootstrap iac/app; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done
