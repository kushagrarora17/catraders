name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

# Superseded PR runs are cancelled; main runs never are (the deploy workflow keys off them).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catraders
          POSTGRES_PASSWORD: catraders
          POSTGRES_DB: catraders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catraders -d catraders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://catraders:catraders@localhost:5432/catraders
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run db:migrate

      # The deploy workflow only applies committed migrations, so a schema change without one
      # would ship code that expects tables or columns that don't exist.
      - name: Check migrations match src/server/db/schema.ts
        run: |
          bun run db:generate
          git diff --exit-code -- drizzle
          test -z "$(git ls-files --others --exclude-standard -- drizzle)" || { echo "::error::schema.ts changed without a migration; run bun run db:generate and commit the result"; exit 1; }

      - run: bun run test
      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: catraders
          POSTGRES_PASSWORD: catraders
          POSTGRES_DB: catraders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U catraders -d catraders"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://catraders:catraders@localhost:5432/catraders
      E2E_DATABASE_URL: postgres://catraders:catraders@localhost:5432/catraders
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run db:migrate

      # Builds the app with coverage instrumentation against the mock Sanity API, runs the
      # Playwright specs, then fails if line coverage of src/ is under the threshold.
      - run: bun run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: e2e-report
          path: |
            coverage/e2e
            playwright-report
            test-results
          retention-days: 14

  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile
      - run: bun run validate
      - run: bun run build

      - name: Check generated Sanity types are up to date
        run: |
          bun run typegen
          git diff --exit-code ../src/sanity/types.ts

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"

      - run: terraform fmt -check -recursive iac

      - name: Validate stacks
        run: |
          for stack in iac/bootstrap iac/app; do
            terraform -chdir="$stack" init -backend=false -input=false
            terraform -chdir="$stack" validate
          done

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Lint workflows
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          ./actionlint -color

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  # The single check required by the main ruleset (.github/rulesets/main.json). Add new jobs to
  # `needs` here instead of editing the ruleset.
  ci-ok:
    if: always()
    needs: [web, e2e, studio, terraform, actionlint, dependency-review, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail unless every job passed or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
