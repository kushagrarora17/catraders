name: Owner auto-merge

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify auto-merge
        run: >-
          gh pr view "$PR_URL" --json state,autoMergeRequest
          --jq 'if .state == "MERGED" or .autoMergeRequest.mergeMethod == "SQUASH"
          then "Squash auto-merge enabled or PR merged"
          else error("Squash auto-merge is disabled") end'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dispatch-ci:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: owner-dispatch-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Dispatch CI for the auto-merge commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          PR_AUTHOR: ${{ github.repository_owner }}
        run: bash .github/scripts/dispatch-ci-after-automerge.sh
