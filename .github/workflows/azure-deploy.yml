name: Deploy Next.js Automotive App to Azure

# Deploys main only after CI has passed for that commit. Authenticates with
# GitHub OIDC (no stored secrets); infrastructure comes from iac/app.
#
# A push to main starts CI, and this workflow runs from that CI run's workflow_run.
# Dependabot auto-merge pushes with GITHUB_TOKEN, which does not start CI; the
# auto-merge workflow dispatches CI for the squash SHA instead. That run's event
# is workflow_dispatch, and it is deployed the same way. There is no push trigger
# here, so a human merge does not deploy once from the push and again from CI.
#
# Order: build and push the image (no side effects) -> run database migrations -> deploy -> warm the public site.
# A failed migration stops the run before the site is touched. Migrations are forward-only, so
# write them to stay compatible with the previous release, which keeps serving until the deploy.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Run workflow on this file to redeploy the current tip of main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  resolve-sha:
    # Skipped until the repository variables from `terraform output github_actions_variables` are set
    # (secrets can't be read in job-level `if`, so the gate uses a variable).
    # The `branches` filter matches branch names, so a fork PR from a branch called "main" starts
    # this workflow; pull_request CI is not in the event list, so it never takes the Azure identity.
    # Manual runs have to target main. Dispatched CI is accepted only for this repository.
    if: >-
      vars.AZURE_WEBAPP_NAME != '' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        (github.event.workflow_run.event == 'push' ||
         github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      # workflow_run loads this file from the default branch. Check that commit out
      # so the guard script matches the workflow, not an older CI SHA.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - name: Resolve the commit CI validated
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! sha=$(bash .github/scripts/resolve-deploy-sha.sh); then
            echo "::error::Could not resolve the deploy SHA"
            exit 1
          fi
          if [ -n "$sha" ]; then
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
            echo "Deploying $sha"
          fi

  build-and-deploy:
    needs: resolve-sha
    if: needs.resolve-sha.result == 'success' && needs.resolve-sha.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Must match the federated credential subject in iac/app/github.tf.
    environment: production
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/automotive-site:${{ needs.resolve-sha.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-sha.outputs.sha }}

      # Installed before the Azure login so install scripts never run with Azure credentials.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile

      # IDs are `production` environment secrets so they're masked in public logs.
      - name: Log in to Azure (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and Push Docker Image
        env:
          # Optional repo variable for a custom domain; defaults to the web app's hostname.
          SITE_URL: ${{ vars.SITE_URL || format('https://{0}.azurewebsites.net', vars.AZURE_WEBAPP_NAME) }}
        run: |
          docker build -f docker/Dockerfile --build-arg SITE_URL="$SITE_URL" -t "$IMAGE" .
          docker push "$IMAGE"

      # The Postgres server only accepts listed IPs, so open a rule for this runner, migrate, and
      # close it again. The rule is named per run; any left behind by a cancelled run is removed first.
      - name: Open a temporary Postgres firewall rule for this runner
        id: firewall
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POSTGRES_SERVER: ${{ vars.AZURE_POSTGRES_SERVER }}
          KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          if [ -z "$POSTGRES_SERVER" ] || [ -z "$KEY_VAULT_NAME" ]; then
            echo "::error::Repository variables AZURE_POSTGRES_SERVER and AZURE_KEY_VAULT_NAME are not set. Run terraform apply in iac/app, then set the variables from the github_actions_variables output."
            exit 1
          fi

          RUNNER_IP="$(curl -fsS --retry 3 https://api.ipify.org || curl -fsS --retry 3 https://checkip.amazonaws.com)"
          RUNNER_IP="$(echo "$RUNNER_IP" | tr -d '[:space:]')"
          [[ "$RUNNER_IP" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::Could not determine the runner's IPv4 address"; exit 1; }

          for stale in $(az postgres flexible-server firewall-rule list -g "$RESOURCE_GROUP" -s "$POSTGRES_SERVER" \
              --query "[?starts_with(name, 'github-runner-')].name" -o tsv); do
            az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" -s "$POSTGRES_SERVER" -n "$stale" --yes
          done

          RULE="github-runner-${GITHUB_RUN_ID}"
          az postgres flexible-server firewall-rule create -g "$RESOURCE_GROUP" -s "$POSTGRES_SERVER" \
            -n "$RULE" --start-ip-address "$RUNNER_IP" --end-ip-address "$RUNNER_IP" > /dev/null
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"

      - name: Run database migrations
        timeout-minutes: 15
        env:
          KEY_VAULT_NAME: ${{ vars.AZURE_KEY_VAULT_NAME }}
          SECRET_NAME: ${{ vars.AZURE_DATABASE_URL_SECRET || 'database-url' }}
          # Azure can take a while to enforce a new firewall rule; scripts/migrate.ts retries until then.
          MIGRATE_CONNECT_TIMEOUT_SECONDS: "300"
        run: |
          set -euo pipefail
          DATABASE_URL="$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name "$SECRET_NAME" --query value -o tsv)"
          # Mask the whole URL and its password before anything can print them.
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$(printf '%s' "$DATABASE_URL" | sed -E 's#^[^:]+://[^:]+:([^@]+)@.*#\1#')"
          export DATABASE_URL
          bun run db:migrate

      - name: Remove the temporary firewall rule
        if: always() && steps.firewall.outputs.rule != ''
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          POSTGRES_SERVER: ${{ vars.AZURE_POSTGRES_SERVER }}
          RULE: ${{ steps.firewall.outputs.rule }}
        run: az postgres flexible-server firewall-rule delete -g "$RESOURCE_GROUP" -s "$POSTGRES_SERVER" -n "$RULE" --yes

      - name: Deploy to Azure Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          images: ${{ env.IMAGE }}

      # The new container's first real page can take about a minute. Hit the
      # public site (cache revalidated) so the next visitor does not pay that.
      # Slow 200s are a warning; a URL that never returns 200 fails the job.
      - name: Warm the public site
        timeout-minutes: 20
        env:
          ORIGIN: https://caelitelube.com
        run: bash .github/scripts/warmup-site.sh
