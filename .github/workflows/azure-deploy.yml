name: Deploy Next.js Automotive App to Azure

# Deploys main only after CI has passed for that commit. Authenticates with
# GitHub OIDC (no stored secrets); infrastructure comes from iac/app.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Skipped until the repository variables from `terraform output github_actions_variables` are set
    # (secrets can't be read in job-level `if`, so the gate uses a variable).
    # For workflow_run, only deploy CI runs triggered by a push to this repo: the `branches`
    # filter matches branch *names*, so a fork PR from a branch called "main" would otherwise
    # get this job to build and deploy untrusted code with the Azure identity.
    if: >-
      vars.AZURE_WEBAPP_NAME != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    # Must match the federated credential subject in iac/app/github.tf.
    environment: production
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/automotive-site:${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # IDs are `production` environment secrets so they're masked in public logs.
      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to Azure Container Registry
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build and Push Docker Image
        run: |
          docker build -f docker/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Azure Web App for Containers
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          resource-group-name: ${{ vars.AZURE_RESOURCE_GROUP }}
          images: ${{ env.IMAGE }}
